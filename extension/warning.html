<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dangerous link blocked</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #b3261e; color: #fff;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { max-width: 560px; padding: 40px; text-align: center; }
    h1 { font-size: 32px; margin: 0 0 12px; }
    p { font-size: 17px; line-height: 1.5; margin: 8px 0; }
    .url { background: rgba(0,0,0,.25); padding: 10px 14px; border-radius: 8px;
           word-break: break-all; font-family: monospace; margin: 18px 0; }
    .meta { opacity: .9; }
    button { font-size: 16px; padding: 12px 22px; border-radius: 8px; border: 0; cursor: pointer; margin: 8px; }
    #back { background: #fff; color: #b3261e; font-weight: 600; }
    #proceed { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.6); }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size:56px">⚠️</div>
    <h1>Dangerous link blocked</h1>
    <p>This page has been reported as a scam by the community.</p>
    <div class="url" id="url"></div>
    <p class="meta" id="meta"></p>
    <button id="back">Go back to safety</button>
    <button id="proceed">Proceed anyway (not recommended)</button>
  </div>
  <script src="warning.js"></script>
</body>
</html>
